<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <link rel ="stylesheet" href="style.css">

<body>
    <div class="game">
    <h1>🎲 Dice Game 🎲</h1>

        <div class="dice" id="dice2"></div>

    </div>
    <button onclick="rollDice()">Roll dice</button>
    <div class="result" id="result" ></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
