<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #ff7043, #ff5722);
      color: white;
      margin: 0;
    }

    .container {
      padding: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 18px;
    }

    .card-content h3 {
      margin: 0 0 10px;
      color: #333;
    }

    .badges span {
      display: inline-block;
      background: #ffe0b2;
      color: #e65100;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 6px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .info {
      font-size: 14px;
      margin: 8px 0;
      color: #444;
    }

    .section {
      margin-top: 12px;
    }

    .section h4 {
      margin: 0 0 6px;
      color: #ff5722;
      font-size: 15px;
    }

    ul, ol {
      padding-left: 18px;
      margin: 0;
      font-size: 13px;
      color: #555;
    }
  </style>
<body>
    <h1>All Recipes</h1>
    <div class="container" id="recipes"></div>
    <script>
         fetch("https://dummyjson.com/recipes")
         .then(res=>res.json())
         .then(data=>{
            const container = document.getElementById("recipes");

            data.recipes.forEach(recipe =>{
                const card = document.createElement("div");
                card.className="card";
                
                card.innerHTML=`
                <img src ="${recipe.image}" alt ="${recipe.name}">
                <div class="card-content">
                    <h3>${recipe.name}</h3>

                    <div class="badges">
                        <span>${recipe.cusine}</span>
                        <span>${recipe.difficulty}</span>
                        <span>⭐${recipe.rating}</span>
                        </div>
                        
                        <div class="info">Prep time:${recipe.prepTimeMinutes}mins</div>
                        <div class="info">cook time:${recipe.cookTimeMinutes}mins</div>
                        <div class="info">calories:${recipe.caloriesPerServing}</div>
                        <div class="info">servings:${recipe.servings}</div>
                        
                        <div class="section">
                            <h4>ingredients</h4>
                            <ul>
                                ${recipe.ingredients.map(item =>`<li>${item}</li>`).join("")}
                                    </ul>
                                    </div>
                         
                        <div class="section">
                            <h4>instructions</h4>
                            <ol>
                                ${recipe.instructions.map(step =>`<li>${step}</li>`).join("")}
                                </ol>
                                </div>

                                </div>
                        `;
container.appendChild(card);
            });
         });

    </script>
</body>
</html>
